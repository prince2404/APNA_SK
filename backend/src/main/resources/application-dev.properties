# =============================================================================
# ASK - Development Configuration
# All credentials loaded from environment variables (see .env.example).
# =============================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ask_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.ask=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
