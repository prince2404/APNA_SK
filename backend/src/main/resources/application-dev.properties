# =============================================================================
# ASK - Development Configuration
# =============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ask_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.ask=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
