# =============================================================================
# ASK - Production Configuration
# Values should be provided through environment variables or deployment secrets.
# =============================================================================

spring.datasource.url=${ASK_DB_URL}
spring.datasource.username=${ASK_DB_USERNAME}
spring.datasource.password=${ASK_DB_PASSWORD}

ask.jwt.secret=${ASK_JWT_SECRET}
ask.encryption.secret-key=${ASK_ENCRYPTION_SECRET_KEY}

spring.mail.username=${ASK_MAIL_USERNAME}
spring.mail.password=${ASK_MAIL_PASSWORD}

spring.jpa.show-sql=false
logging.level.com.ask=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

server.forward-headers-strategy=framework
