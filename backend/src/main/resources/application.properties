# =============================================================================
# ASK — Application Configuration (Default / Development)
# All secrets are loaded from environment variables.
# Copy .env.example → .env and fill in your values.
# =============================================================================

spring.application.name=apna-swasthya-kendra

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ask_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ASK-HikariPool

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Server ---
server.port=8080
server.servlet.context-path=/api

# --- JWT ---
ask.jwt.secret=${JWT_SECRET}
ask.jwt.access-token-expiry-ms=900000
ask.jwt.refresh-token-expiry-ms=604800000

# --- 2FA OTP ---
ask.otp.expiry-minutes=5
ask.otp.length=6

# --- Security ---
ask.security.bcrypt-strength=12
ask.security.max-failed-attempts=5
ask.security.lockout-duration-minutes=30

# --- Rate Limiting ---
ask.rate-limit.auth.capacity=10
ask.rate-limit.auth.refill-minutes=1

# --- AES Encryption ---
ask.encryption.secret-key=${AES_SECRET_KEY}

# --- Mail (SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Super Admin Seeder ---
ask.admin.email=${SUPER_ADMIN_EMAIL}
ask.admin.password=${SUPER_ADMIN_PASSWORD}

# --- Async Thread Pool ---
ask.async.core-pool-size=5
ask.async.max-pool-size=10
ask.async.queue-capacity=100

# --- Logging ---
logging.level.root=INFO
logging.level.com.ask=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
