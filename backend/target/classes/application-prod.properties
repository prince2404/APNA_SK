# =============================================================================
# ASK — Production Configuration
# Overrides default application.properties for production deployment.
# All secrets are loaded from the same environment variables as development.
# =============================================================================

# Reduce logging in production
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ask=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Trust proxy headers (Railway, Render, etc. run behind a reverse proxy)
server.forward-headers-strategy=framework
