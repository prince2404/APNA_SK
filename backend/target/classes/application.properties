# =============================================================================
# ASK — Application Configuration (Default / Development)
# =============================================================================

spring.application.name=apna-swasthya-kendra

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/ask_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ASK-HikariPool

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Server ---
server.port=8080
server.servlet.context-path=/api

# --- JWT ---
ask.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_MIN_64_CHARS_1234567890ABCDEF
ask.jwt.access-token-expiry-ms=900000
ask.jwt.refresh-token-expiry-ms=604800000

# --- 2FA OTP ---
ask.otp.expiry-minutes=5
ask.otp.length=6

# --- Security ---
ask.security.bcrypt-strength=12
ask.security.max-failed-attempts=5
ask.security.lockout-duration-minutes=30

# --- Rate Limiting ---
ask.rate-limit.auth.capacity=10
ask.rate-limit.auth.refill-minutes=1

# --- AES Encryption ---
ask.encryption.secret-key=CHANGE_THIS_32_CHAR_AES_KEY_0123

# --- Mail (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- Async Thread Pool ---
ask.async.core-pool-size=5
ask.async.max-pool-size=10
ask.async.queue-capacity=100

# --- Logging ---
logging.level.root=INFO
logging.level.com.ask=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
